version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  backend:
    build: ./backend
    command: gunicorn server.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://gameuser:gamepass@db:5432/game
      - DEBUG=0
    depends_on:
      - db
    networks:
      - appnet

  frontend:
    build: ./frontend
    ports:
      - "5173:80"   # Vue 開發測試時可以用 5173，部署時 80 就好
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:

volumes:
  postgres_data: